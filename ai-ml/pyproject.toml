[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:app",
    "error::PendingDeprecationWarning:app",
    "error::DeprecationWarning:tests",
    "ignore:.*Using `httpx` with `starlette.testclient`.*:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*BlockingPortal.*:DeprecationWarning:anyio",
]
pythonpath = ["."]
asyncio_mode = "auto"